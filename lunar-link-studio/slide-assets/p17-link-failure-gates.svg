<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="100%" height="100%" fill="white"/><style>
text{font-family:Arial,"Noto Sans Thai",sans-serif;fill:#17283b}.title{font-size:34px;font-weight:700}.sub{font-size:18px;fill:#526476}.label{font-size:18px;font-weight:700}.value{font-size:25px;font-weight:700}.small{font-size:15px;fill:#526476}.tag{font-size:13px;font-weight:700;letter-spacing:1px}.grid{stroke:#dce3e8;stroke-width:1}.axis{stroke:#71808e;stroke-width:1.5}.green{fill:#66a80f}.orange{fill:#e8590c}.red{fill:#c92a2a}.navy{fill:#17283b}.white{fill:#fff}.card{fill:#f8fafb;stroke:#d7dfe5;stroke-width:1.5}.warn{fill:#fff4e6;stroke:#ffa94d;stroke-width:1.5}</style>
<text x="38" y="52" class="title">A successful link requires every gate to pass</text><text x="38" y="83" class="sub">Pointing recovery is one gate in an end-to-end communications chain</text>
<rect x="38" y="145" width="205" height="260" rx="12" class="card"/><circle cx="73" cy="180" r="19" fill="#17283b"/><text x="73" y="187" text-anchor="middle" class="white" style="font:700 18px Arial">1</text><text x="56" y="235" class="value">Earth visible</text><text x="56" y="275" class="small">Above local horizon</text><text x="56" y="332" class="label">Required</text><text x="56" y="368" class="small">Fail → no usable link</text><line x1="247" y1="286" x2="262" y2="286" stroke="#17283b" stroke-width="3"/><polygon points="262,280 262,292 269,286" fill="#17283b"/><rect x="267" y="145" width="205" height="260" rx="12" class="card"/><circle cx="302" cy="180" r="19" fill="#17283b"/><text x="302" y="187" text-anchor="middle" class="white" style="font:700 18px Arial">2</text><text x="285" y="235" class="value">Line of sight</text><text x="285" y="275" class="small">No hull / terrain / burial</text><text x="285" y="332" class="label">Required</text><text x="285" y="368" class="small">Fail → no usable link</text><line x1="476" y1="286" x2="491" y2="286" stroke="#17283b" stroke-width="3"/><polygon points="491,280 491,292 498,286" fill="#17283b"/><rect x="496" y="145" width="205" height="260" rx="12" class="card"/><circle cx="531" cy="180" r="19" fill="#17283b"/><text x="531" y="187" text-anchor="middle" class="white" style="font:700 18px Arial">3</text><text x="514" y="235" class="value">Mechanism</text><text x="514" y="275" class="small">Travel + 2U clearance + no jam</text><text x="514" y="332" class="label">Required</text><text x="514" y="368" class="small">Fail → no usable link</text><line x1="705" y1="286" x2="720" y2="286" stroke="#17283b" stroke-width="3"/><polygon points="720,280 720,292 727,286" fill="#17283b"/><rect x="725" y="145" width="205" height="260" rx="12" class="card"/><circle cx="760" cy="180" r="19" fill="#17283b"/><text x="760" y="187" text-anchor="middle" class="white" style="font:700 18px Arial">4</text><text x="743" y="235" class="value">Host services</text><text x="743" y="275" class="small">Power + radio + data available</text><text x="743" y="332" class="label">Required</text><text x="743" y="368" class="small">Fail → no usable link</text><line x1="934" y1="286" x2="949" y2="286" stroke="#17283b" stroke-width="3"/><polygon points="949,280 949,292 956,286" fill="#17283b"/><rect x="954" y="145" width="205" height="260" rx="12" class="card"/><circle cx="989" cy="180" r="19" fill="#17283b"/><text x="989" y="187" text-anchor="middle" class="white" style="font:700 18px Arial">5</text><text x="972" y="235" class="value">RF closure</text><text x="972" y="275" class="small">Margin ≥ reserve + bandwidth</text><text x="972" y="332" class="label">Required</text><text x="972" y="368" class="small">Fail → no usable link</text>
<rect x="38" y="444" width="1124" height="145" rx="12" class="warn"/><text x="62" y="486" class="value orange">Current 65° installed case: FAIL at Gate 2 — LANDER HULL</text><text x="62" y="526" class="label">The gimbal reaches the target and the clear-path RF budget closes, but the current green-zone mount has no clear ray.</text><text x="62" y="560" class="small">Use on page 17 · This is a design finding: optimize mount/FOV or add another aperture; do not hide the obstruction result.</text><text x="38" y="645" class="small">Reduced-order geometry and RF model; not terrain propagation, EM, mechanism or qualification evidence.</text></svg>