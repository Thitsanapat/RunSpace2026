<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="100%" height="100%" fill="white"/><style>
text{font-family:Arial,"Noto Sans Thai",sans-serif;fill:#17283b}.title{font-size:34px;font-weight:700}.sub{font-size:18px;fill:#526476}.label{font-size:18px;font-weight:700}.value{font-size:25px;font-weight:700}.small{font-size:15px;fill:#526476}.tag{font-size:13px;font-weight:700;letter-spacing:1px}.grid{stroke:#dce3e8;stroke-width:1}.axis{stroke:#71808e;stroke-width:1.5}.green{fill:#66a80f}.orange{fill:#e8590c}.red{fill:#c92a2a}.navy{fill:#17283b}.white{fill:#fff}.card{fill:#f8fafb;stroke:#d7dfe5;stroke-width:1.5}.warn{fill:#fff4e6;stroke:#ffa94d;stroke-width:1.5}</style>
<text x="38" y="52" class="title">Power boundary · lander DC feeds the complete 2U payload</text>
<text x="38" y="83" class="sub">Transceiver/PA and local heater are onboard; 5 W RF is output power, not bus input</text>
<rect x="38" y="112" width="540" height="420" rx="12" class="card"/><rect x="622" y="112" width="540" height="420" rx="12" class="card"/>
<text x="62" y="158" class="value">Lander-powered payload branch</text><text x="62" y="202" class="label">Functional peak</text><text x="548" y="202" class="label" text-anchor="end">22.11 W</text><text x="62" y="239" class="label">Local payload/gimbal heater</text><text x="548" y="239" class="label" text-anchor="end">30.0 W</text><text x="62" y="276" class="label">Worst-case simultaneous total</text><text x="548" y="276" class="value orange" text-anchor="end">52.11 W</text><text x="62" y="319" class="label">Current / allocation</text><text x="548" y="319" class="label orange" text-anchor="end">2.51 / 0.5 A</text><text x="62" y="362" class="label">Entered inrush</text><text x="548" y="362" class="label orange" text-anchor="end">0.8 A · FAIL</text><text x="62" y="405" class="label">Ideal hold-up</text><text x="548" y="405" class="label orange" text-anchor="end">0.48 / 100 ms</text><text x="62" y="468" class="small">Requires heater/motor sizing, operating modes and real bus ICD.</text>
<text x="646" y="158" class="value">Onboard payload RF / PA branch</text><text x="646" y="202" class="label">RF output used by link budget</text><text x="1132" y="202" class="value" text-anchor="end">5.00 W RF</text><text x="646" y="245" class="label">Assumed PA efficiency</text><text x="1132" y="245" class="label" text-anchor="end">35%</text><text x="646" y="288" class="label">PA DC input alone</text><text x="1132" y="288" class="value orange" text-anchor="end">≈14.29 W DC</text><text x="646" y="331" class="label">Feed/cable loss</text><text x="1132" y="331" class="label" text-anchor="end">1.00 dB</text><text x="646" y="374" class="label">Required host interface</text><text x="1132" y="374" class="label" text-anchor="end">DC bus + data only</text><text x="646" y="435" class="small">TX, gimbal and heater all draw from the lander payload branch.</text><text x="646" y="468" class="small">Operating modes should prevent unnecessary simultaneous peaks.</text>
<rect x="38" y="560" width="1124" height="104" rx="10" class="warn"/><text x="58" y="598" class="label">Use on page 10 · Current ≈1.67 W transmission row cannot represent a 5 W RF onboard transmitter.</text><text x="58" y="632" class="small">Revised worst-case branch = functional RF/gimbal peak + 30 W local heater; mark the result as an ICD gap.</text></svg>