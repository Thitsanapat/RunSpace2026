<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="100%" height="100%" fill="white"/><style>text{font-family:Arial,"Noto Sans Thai",sans-serif;fill:#17283b}.title{font-size:32px;font-weight:700}.sub{font-size:17px;fill:#526476}.h{font-size:23px;font-weight:700}.label{font-size:17px;font-weight:700}.small{font-size:14px;fill:#526476}.white{fill:#fff}.green{fill:#66a80f}.orange{fill:#e8590c}.red{fill:#c92a2a}.blue{fill:#1971c2}.grid{stroke:#dce3e8;stroke-width:1}.card{fill:#f8fafb;stroke:#d7dfe5;stroke-width:1.5}.warn{fill:#fff4e6;stroke:#ffa94d;stroke-width:1.5}</style><text x="38" y="50" class="title">S-band RF evidence matrix · what the slide may claim today</text><text x="38" y="80" class="sub">“Available” means the simulator can plot it; it does not mean measured or flight-qualified</text><rect x="38" y="135" width="245" height="44" fill="#17283b"/><text x="51" y="164" class="label white">Evidence item</text><rect x="290" y="135" width="208" height="44" fill="#17283b"/><text x="303" y="164" class="label white">Status</text><rect x="505" y="135" width="268" height="44" fill="#17283b"/><text x="518" y="164" class="label white">Current basis</text><rect x="780" y="135" width="382" height="44" fill="#17283b"/><text x="793" y="164" class="label white">What closes the gap</text><rect x="38" y="182" width="245" height="62" fill="#fff" stroke="#d7dfe5"/><text x="51" y="219" class="small">Gain vs angle</text><rect x="290" y="182" width="208" height="62" fill="#ebfbee" stroke="#d7dfe5"/><text x="303" y="219" class="label green">AVAILABLE</text><rect x="505" y="182" width="268" height="62" fill="#fff" stroke="#d7dfe5"/><text x="518" y="219" class="small">Analytical cosine; 6.5 dBic input</text><rect x="780" y="182" width="382" height="62" fill="#fff" stroke="#d7dfe5"/><text x="793" y="219" class="small">Replace with mounted chamber pattern</text><rect x="38" y="247" width="245" height="62" fill="#f8fafb" stroke="#d7dfe5"/><text x="51" y="284" class="small">3D radiation</text><rect x="290" y="247" width="208" height="62" fill="#ebfbee" stroke="#d7dfe5"/><text x="303" y="284" class="label green">AVAILABLE</text><rect x="505" y="247" width="268" height="62" fill="#f8fafb" stroke="#d7dfe5"/><text x="518" y="284" class="small">Same assumed angular model</text><rect x="780" y="247" width="382" height="62" fill="#f8fafb" stroke="#d7dfe5"/><text x="793" y="284" class="small">Import θ–φ measured/EM grid</text><rect x="38" y="312" width="245" height="62" fill="#fff" stroke="#d7dfe5"/><text x="51" y="349" class="small">Gain vs frequency</text><rect x="290" y="312" width="208" height="62" fill="#fff4e6" stroke="#d7dfe5"/><text x="303" y="349" class="label orange">MISSING</text><rect x="505" y="312" width="268" height="62" fill="#fff" stroke="#d7dfe5"/><text x="518" y="349" class="small">Literature points only</text><rect x="780" y="312" width="382" height="62" fill="#fff" stroke="#d7dfe5"/><text x="793" y="349" class="small">VNA/chamber or validated EM sweep</text><rect x="38" y="377" width="245" height="62" fill="#f8fafb" stroke="#d7dfe5"/><text x="51" y="414" class="small">S11 vs frequency</text><rect x="290" y="377" width="208" height="62" fill="#fff4e6" stroke="#d7dfe5"/><text x="303" y="414" class="label orange">MISSING</text><rect x="505" y="377" width="268" height="62" fill="#f8fafb" stroke="#d7dfe5"/><text x="518" y="414" class="small">Scalar −15 dB assumption</text><rect x="780" y="377" width="382" height="62" fill="#f8fafb" stroke="#d7dfe5"/><text x="793" y="414" class="small">Mounted VNA sweep incl. feed/coax</text><rect x="38" y="442" width="245" height="62" fill="#fff" stroke="#d7dfe5"/><text x="51" y="479" class="small">Axial ratio vs frequency</text><rect x="290" y="442" width="208" height="62" fill="#fff4e6" stroke="#d7dfe5"/><text x="303" y="479" class="label orange">MISSING</text><rect x="505" y="442" width="268" height="62" fill="#fff" stroke="#d7dfe5"/><text x="518" y="479" class="small">Scalar 3 dB assumption</text><rect x="780" y="442" width="382" height="62" fill="#fff" stroke="#d7dfe5"/><text x="793" y="479" class="small">Dual-pol chamber measurement</text><rect x="38" y="507" width="245" height="62" fill="#f8fafb" stroke="#d7dfe5"/><text x="51" y="544" class="small">Gain/S11/AR vs temperature</text><rect x="290" y="507" width="208" height="62" fill="#fff4e6" stroke="#d7dfe5"/><text x="303" y="544" class="label orange">MISSING</text><rect x="505" y="507" width="268" height="62" fill="#f8fafb" stroke="#d7dfe5"/><text x="518" y="544" class="small">RF temperature coefficient = 0</text><rect x="780" y="507" width="382" height="62" fill="#f8fafb" stroke="#d7dfe5"/><text x="793" y="544" class="small">Thermal-vacuum RF test</text><rect x="38" y="572" width="245" height="62" fill="#fff" stroke="#d7dfe5"/><text x="51" y="609" class="small">Installed lander coupling</text><rect x="290" y="572" width="208" height="62" fill="#fff4e6" stroke="#d7dfe5"/><text x="303" y="609" class="label orange">MISSING</text><rect x="505" y="572" width="268" height="62" fill="#fff" stroke="#d7dfe5"/><text x="518" y="609" class="small">Hull only blocks geometric ray</text><rect x="780" y="572" width="382" height="62" fill="#fff" stroke="#d7dfe5"/><text x="793" y="609" class="small">Full-wave mounted EM model/test</text><rect x="38" y="655" width="1124" height="32" rx="7" class="warn"/><text x="600" y="677" class="small" text-anchor="middle">Do not draw a smooth gain/S11/AR-vs-frequency curve from isolated literature points.</text></svg>