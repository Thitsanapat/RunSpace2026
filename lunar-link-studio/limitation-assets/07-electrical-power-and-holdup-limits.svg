<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="100%" height="100%" fill="white"/><style>text{font-family:Arial,"Noto Sans Thai",sans-serif;fill:#17283b}.title{font-size:32px;font-weight:700}.sub{font-size:17px;fill:#526476}.h{font-size:23px;font-weight:700}.label{font-size:17px;font-weight:700}.small{font-size:14px;fill:#526476}.tiny{font-size:12px;fill:#526476}.white{fill:#fff}.green{fill:#66a80f}.orange{fill:#e8590c}.red{fill:#c92a2a}.blue{fill:#1971c2}.grid{stroke:#dce3e8;stroke-width:1}.axis{stroke:#71808e;stroke-width:1.5}.card{fill:#f8fafb;stroke:#d7dfe5;stroke-width:1.5}.warn{fill:#fff4e6;stroke:#ffa94d;stroke-width:1.5}</style><text x="38" y="50" class="title">Electrical interface limitations · current, heater, RF power and hold-up</text><text x="38" y="80" class="sub">Lander DC bus supplies the complete payload, onboard RF/PA and local heater · simultaneous-load screening</text><rect x="38" y="110" width="540" height="515" rx="12" class="card"/><text x="62" y="153" class="h">Current and power boundary</text><text x="62" y="198" class="label">Functional branch</text><text x="548" y="198" class="h" text-anchor="end">22.11 W</text><text x="62" y="238" class="label">Local heater</text><text x="548" y="238" class="h" text-anchor="end">30.00 W</text><text x="62" y="278" class="label">Worst-case total</text><text x="548" y="278" class="h orange" text-anchor="end">52.11 W</text><text x="62" y="318" class="label">Bus current / allocation</text><text x="548" y="318" class="h orange" text-anchor="end">2.51 / 0.5 A</text><text x="62" y="358" class="label">Ideal hold-up</text><text x="548" y="358" class="h orange" text-anchor="end">0.48 / 100 ms</text><line x1="62" y1="382" x2="548" y2="382" class="grid"/><text x="62" y="428" class="label">Onboard PA RF output</text><text x="548" y="428" class="h" text-anchor="end">5.00 W RF</text><text x="62" y="476" class="label">PA DC at 35%</text><text x="548" y="476" class="h o